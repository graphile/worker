name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    if: github.event_name == 'push' && github.ref_name == 'main'
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: read
      # Required for npm trusted publishing via GitHub Actions OIDC.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn --immutable

      - name: Create release pull request or publish to npm
        uses: changesets/action@v2
        with:
          version-script: yarn changeset-version
          publish-script: yarn changeset-publish

  snapshot:
    if:
      github.event_name == 'workflow_dispatch' && ( github.ref_name == 'main' ||
      github.ref_name == 'next' )
    name: Publish snapshot
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Required for npm trusted publishing via GitHub Actions OIDC.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn --immutable

      - name: Calculate snapshot version
        run: |
          yarn changeset version --snapshot "${{ github.ref_name }}"
          node scripts/postversion.mjs
        env:
          CHANGESETS_NO_COMMIT: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snapshot
        run:
          yarn prepack && npm stage publish --tag "snapshot-${{ github.ref_name }}"
