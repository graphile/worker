name: CI

on: [push, pull_request]

env:
  CI: true
  PGUSER: postgres
  PGPASSWORD: postgres
  PGHOST: "127.0.0.1"
  PGPORT: 5432
  NODE_OPTIONS: "--disable-proto=delete"

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        postgres-version: [14, 15, 16, 17, 18]
        include:
          - node-version: 22.x
            postgres-version: 14
          - node-version: 26.x
            postgres-version: 18

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphile_worker_test
        ports:
          - "0.0.0.0:5432:5432"
        # needed because the postgres container does not provide a healthcheck
        options:
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn --frozen-lockfile
      - run: yarn prepack
      - run: yarn test:setupdb
      - run: yarn test:only --ci

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: yarn --frozen-lockfile
      - run: yarn lint

  altschema:
    runs-on: ubuntu-latest
    env:
      GRAPHILE_WORKER_SCHEMA: custom_schema

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphile_worker_test
        ports:
          - "0.0.0.0:5432:5432"
        # needed because the postgres container does not provide a healthcheck
        options:
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: yarn --frozen-lockfile
      - run: yarn prepack
      - run: yarn test:setupdb
      - run: yarn test:only --ci

  database_updated:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphile_worker_test
        ports:
          - "0.0.0.0:5432:5432"
        # needed because the postgres container does not provide a healthcheck
        options:
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: yarn --frozen-lockfile
      - name: Install pg_dump
        run: |
          sudo bash -c "echo deb http://apt.postgresql.org/pub/repos/apt/ jammy-pgdg main >> /etc/apt/sources.list.d/pgdg.list"
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get -yqq install postgresql-client-11
      - name: "Build code"
        run: |
          yarn prepack
          ln -s .. node_modules/graphile-worker || true
      - name: "Check schema hasn't changed"
        run: |
          yarn db:dump
          git update-index -q --refresh
          git diff-index --quiet HEAD -- || (git diff && echo "^^^ The database schema has changed, please run 'yarn db:dump'" && exit 1)

  test_platforms:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        node-version: [lts/*]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Start PostgreSQL 17 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PGPASSWORD: root
        run: |
          Set-Service postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17

          $env:PGPASSWORD = "root"

          & "$env:PGBIN\psql.exe" -U postgres -d postgres `
            -c "ALTER USER postgres PASSWORD 'postgres'"

          $env:PGPASSWORD = "postgres"

          & "$env:PGBIN\createdb.exe" -U postgres graphile_worker_test

      - name: Install and start PostgreSQL 18 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          unset PGUSER PGPASSWORD PGHOST PGPORT

          brew install postgresql@18

          PG_BIN="$(brew --prefix postgresql@18)/bin"
          echo "$PG_BIN" >> "$GITHUB_PATH"

          brew services start postgresql@18

          until "$PG_BIN/pg_isready"; do
            sleep 1
          done

          "$PG_BIN/createuser" --superuser postgres
          "$PG_BIN/psql" postgres \
            -c "ALTER USER postgres PASSWORD 'postgres'"
          "$PG_BIN/createdb" --owner postgres graphile_worker_test

      - run: yarn --frozen-lockfile
      - run: yarn prepack
      - run: yarn test:setupdb
      - run: yarn test:only --ci
